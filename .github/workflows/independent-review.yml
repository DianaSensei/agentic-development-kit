name: Independent review

# Reusable workflow: an independent Claude reviewer for pull requests, running
# this kit's `independent-review` skill in a fresh session - never the session
# that wrote the code. Call it from a project's own workflow; ci/README.md has
# the caller to copy and the one secret to set.
#
# Everything here is GitHub glue around ci/review.sh, the same runner GitLab CI
# uses: Claude reviews with no way to post, returning its findings as data, and
# codehost/codehost.py posts them through GitHub's MCP server - an inline
# comment per finding and one summary comment, edited in place on every push.

on:
  workflow_call:
    inputs:
      kit_ref:
        description: "Branch or tag of the kit whose skills the reviewer uses. Pin it to the same tag as the `uses:` line that calls this workflow."
        type: string
        default: main
      kit_repository:
        description: "Repository the kit is cloned from - change only when running a fork of the kit."
        type: string
        default: DianaSensei/agentic-development-kit
      model:
        description: "Model for the reviewer (e.g. claude-opus-5-5). Empty uses Claude Code's default."
        type: string
        default: ""
      fail_on_blocking:
        description: "Fail this check when the review reports blocking findings. Start with false; turn it on once the findings have earned trust."
        type: boolean
        default: false
      extra_instructions:
        description: "Project-specific review instructions appended to the prompt."
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: independent-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The PR merged into its base - the code as it would land. Depth 2 gives
      # the merge commit's first parent, the base, which is what the diff is
      # taken against.
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Cloned outside the workspace so the kit never shows up as part of the
      # change under review.
      - name: Fetch the kit
        env:
          KIT_REPOSITORY: ${{ inputs.kit_repository }}
          KIT_REF: ${{ inputs.kit_ref }}
        run: git clone --quiet --depth 1 --branch "$KIT_REF" "https://github.com/$KIT_REPOSITORY.git" "$RUNNER_TEMP/adk"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code

      # Exit 3 is ci/review.sh's "skipped - no credential": a warning, not a red
      # check, since fork PRs never receive secrets.
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ADK_PROVIDER: github
          ADK_PROJECT: ${{ github.repository }}
          ADK_CHANGE_ID: ${{ github.event.pull_request.number }}
          ADK_DIFF_BASE: HEAD^1
          ADK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ADK_CHANGE_TITLE: ${{ github.event.pull_request.title }}
          ADK_CHANGE_BODY: ${{ github.event.pull_request.body }}
          ADK_SOURCE_BRANCH: ${{ github.head_ref }}
          ADK_TARGET_BRANCH: ${{ github.base_ref }}
          ADK_CODEHOST_TOKEN: ${{ github.token }}
          ADK_CODEHOST_URL: ${{ github.server_url != 'https://github.com' && github.server_url || '' }}
          ADK_CODEHOST_BOT_LOGIN: github-actions[bot]
          ADK_MODEL: ${{ inputs.model }}
          ADK_EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
          ADK_FAIL_ON_BLOCKING: ${{ inputs.fail_on_blocking }}
          ADK_WORK_DIR: ${{ runner.temp }}/review
        run: bash "$RUNNER_TEMP/adk/ci/review.sh" || { rc=$?; [ "$rc" -eq 3 ] || exit "$rc"; }
