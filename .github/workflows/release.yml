name: Release

# A version bump is chosen in the pull request (version-check.yml requires one
# whenever shipped files change) and released when it reaches main: this tags
# the manifests' version and creates the GitHub release. Installed plugins pick
# the new version up from the manifest (see README's "Auto-update").
#
# Run by hand only to retry a release that failed; it releases the version the
# manifests already name and never edits them.
on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release the manifests' version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version .claude-plugin/plugin.json)"
          listed="$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          if [ "$version" != "$listed" ]; then
            echo "::error::plugin.json says $version but marketplace.json says $listed - nothing released."
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain X.Y.Z version - nothing released."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released - nothing to do."
            exit 0
          fi

          previous="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          git tag "v$version"
          git push origin "v$version"
          if [ -n "$previous" ]; then
            gh release create "v$version" --title "v$version" --generate-notes --notes-start-tag "$previous"
          else
            gh release create "v$version" --title "v$version" --generate-notes
          fi
          echo "Released v$version." >> "$GITHUB_STEP_SUMMARY"
