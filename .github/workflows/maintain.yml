name: Maintain

# Reusable workflow: the maintain end of the loop. A deterministic check finds
# problems - control bands in bands.yaml that left their range, a detector that
# broke, or a failed CI run on the default branch - and only then is Claude
# invoked, to record each problem as a proposed intent under docs/intents/.
# The intents land on one standing branch with one open pull request: that PR
# is the triage queue. Claude diagnoses nothing beyond the evidence and fixes
# nothing; a person accepts or rejects each intent, and accepted ones go
# through the normal workflows. Caller and setup: maintain/README.md in the kit.
#
# Everything here is GitHub glue around maintain/run.sh, the same script GitLab
# CI runs; the pull request is opened through GitHub's MCP server.

on:
  workflow_call:
    inputs:
      kit_ref:
        description: "Branch or tag of the kit. Pin it to the same tag as the `uses:` line."
        type: string
        default: main
      kit_repository:
        description: "Repository the kit is cloned from - change only when running a fork of the kit."
        type: string
        default: DianaSensei/agentic-development-kit
      bands_file:
        description: "Control bands file, relative to the repository root."
        type: string
        default: bands.yaml
      failed_run_id:
        description: "A failed workflow run on the default branch to record as a problem (pass github.event.workflow_run.id). Empty for scheduled runs."
        type: string
        default: ""
      model:
        description: "Model that writes the intents. Empty uses Claude Code's default."
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      BANDS_ENV:
        description: "Environment for the band commands, as NAME=value lines (metrics URLs, API tokens). Exported for the check only; every value is redacted from the evidence."
        required: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
    concurrency:
      group: maintain-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the kit
        env:
          KIT_REPOSITORY: ${{ inputs.kit_repository }}
          KIT_REF: ${{ inputs.kit_ref }}
        run: git clone --quiet --depth 1 --branch "$KIT_REF" "https://github.com/$KIT_REPOSITORY.git" "$RUNNER_TEMP/maintain/adk"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          python -m pip install --quiet pyyaml
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code

      # Reading this CI's own run log is GitHub Actions glue, like GitLab's CI_
      # variables; the evidence it produces is provider-neutral.
      - name: Describe the failed run
        if: inputs.failed_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail
          run="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,headBranch,headSha,url,conclusion)"
          [ "$(jq -r .conclusion <<<"$run")" = "failure" ] || { echo "Run $RUN_ID did not fail - nothing to record."; exit 0; }
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | tail -n 60 > "$RUNNER_TEMP/maintain/failed.log" || true
          {
            echo "ADK_FAILED_NAME=$(jq -r .name <<<"$run")"
            echo "ADK_FAILED_URL=$(jq -r .url <<<"$run")"
            echo "ADK_FAILED_REF=$(jq -r .headBranch <<<"$run")"
            echo "ADK_FAILED_SHA=$(jq -r .headSha <<<"$run")"
            echo "ADK_FAILED_LOG_FILE=$RUNNER_TEMP/maintain/failed.log"
          } >> "$GITHUB_ENV"

      - name: Check, propose, publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BANDS_ENV: ${{ secrets.BANDS_ENV }}
          # For band commands that call `gh`; redacted from the evidence like BANDS_ENV.
          GH_TOKEN: ${{ github.token }}
          ADK_REDACT: ${{ github.token }}
          ADK_BANDS_FILE: ${{ inputs.bands_file }}
          ADK_PROVIDER: github
          ADK_PROJECT: ${{ github.repository }}
          ADK_CODEHOST_TOKEN: ${{ github.token }}
          ADK_CODEHOST_URL: ${{ github.server_url != 'https://github.com' && github.server_url || '' }}
          ADK_CODEHOST_BOT_LOGIN: github-actions[bot]
          ADK_GIT_NAME: github-actions[bot]
          ADK_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          ADK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ADK_MODEL: ${{ inputs.model }}
          ADK_WORK_DIR: ${{ runner.temp }}/maintain/work
        run: bash "$RUNNER_TEMP/maintain/adk/maintain/run.sh"
