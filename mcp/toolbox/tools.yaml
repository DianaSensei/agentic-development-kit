# MCP Toolbox for Databases - tools.yaml
# Docs: https://mcp-toolbox.dev/documentation/
#
# All secrets/connection info below are pulled from environment variables
# (see ../.env). Toolbox does NOT read .env files itself — export them into
# the process environment before starting toolbox, e.g.:
#   set -a && source .env && set +a && ./toolbox --config tools.yaml

# =============================================================================
# SOURCES
# =============================================================================

# Multiple PostgreSQL datasources: give each one its own `kind: source`
# block + a unique `name`, pulling from its own set of env vars. To add a
# 3rd/4th datasource, copy one of the blocks below (and its matching tools
# further down) and rename consistently.

kind: source
name: postgres-primary-source
type: postgres
host: ${POSTGRES_PRIMARY_HOST}
port: ${POSTGRES_PRIMARY_PORT}
database: ${POSTGRES_PRIMARY_DATABASE}
user: ${POSTGRES_PRIMARY_USER}
password: ${POSTGRES_PRIMARY_PASSWORD}

---
kind: source
name: postgres-analytics-source
type: postgres
host: ${POSTGRES_ANALYTICS_HOST}
port: ${POSTGRES_ANALYTICS_PORT}
database: ${POSTGRES_ANALYTICS_DATABASE}
user: ${POSTGRES_ANALYTICS_USER}
password: ${POSTGRES_ANALYTICS_PASSWORD}

---
kind: source
name: mysql-source
type: mysql
host: ${MYSQL_HOST}
port: ${MYSQL_PORT}
database: ${MYSQL_DATABASE}
user: ${MYSQL_USER}
password: ${MYSQL_PASSWORD}

---
kind: source
name: tidb-source
type: tidb
host: ${TIDB_HOST}
port: ${TIDB_PORT}
database: ${TIDB_DATABASE}
user: ${TIDB_USER}
password: ${TIDB_PASSWORD}

---
kind: source
name: redis-source
type: redis
address:
  - ${REDIS_ADDRESS}
username: ${REDIS_USERNAME}
password: ${REDIS_PASSWORD}
database: ${REDIS_DATABASE}

---
kind: source
name: mongodb-source
type: mongodb
uri: ${MONGODB_URI}

# =============================================================================
# TOOLS - PostgreSQL (read-only)
# =============================================================================
# Two tools per source, by design:
#   - *_query_data:  free-form SELECT. Its description tells the agent which
#     system catalogs to query for introspection (tables/columns, indexes,
#     sequences, stored procedures), so we don't need a dedicated tool per
#     catalog — the agent writes the SQL based on context.
#   - *_list_tables: kept separately because it returns richer, pre-formatted
#     table schema info (constraints/triggers/owner) than a raw catalog
#     query would conveniently give you.
#
# No UPDATE/DELETE/DROP or any other write/DDL capability is exposed here —
# none of the tools below can execute a write statement. That said,
# postgres-execute-sql (used by *_query_data) forwards whatever SQL text
# it's given, with no parser to reject a write statement at the Toolbox
# layer — this config alone is not a hard guarantee. For a real guarantee,
# POSTGRES_*_USER in .env must itself be a SELECT-only DB role. This repo
# does not create or modify that role — provisioning it is the database
# owner/DBA's responsibility, outside of MCP setup.

---
kind: tool
name: postgres_primary_query_data
type: postgres-execute-sql
source: postgres-primary-source
description: >-
  Run any read-only SQL query (SELECT) against the primary PostgreSQL
  database — general data queries as well as ad hoc schema introspection.
  Do not INSERT/UPDATE/DELETE/DROP/TRUNCATE/ALTER — this connection is
  expected to use a SELECT-only DB role, but always write queries as if
  writes were possible and avoid them. For introspection, query the system
  catalogs directly: information_schema.tables / information_schema.columns
  for tables & columns, pg_indexes for indexes, pg_sequences (or
  information_schema.sequences) for sequences, and pg_proc joined to
  pg_namespace (filter prokind = 'p') and pg_language for stored procedures.
annotations:
  readOnlyHint: true
  destructiveHint: false

---
kind: tool
name: postgres_primary_list_tables
type: postgres-list-tables
source: postgres-primary-source
description: >-
  List schema information (columns, constraints, indexes, triggers, owner)
  for all or specified tables in the primary PostgreSQL database. Optional
  params: table_names (comma-separated), output_format (simple|detailed).
  Prefer this over query_data when you need full, nicely structured table
  schema details.
annotations:
  readOnlyHint: true

---
kind: tool
name: postgres_analytics_query_data
type: postgres-execute-sql
source: postgres-analytics-source
description: >-
  Run any read-only SQL query (SELECT) against the analytics PostgreSQL
  database — general data queries as well as ad hoc schema introspection.
  Do not INSERT/UPDATE/DELETE/DROP/TRUNCATE/ALTER — this connection is
  expected to use a SELECT-only DB role, but always write queries as if
  writes were possible and avoid them. For introspection, query the system
  catalogs directly: information_schema.tables / information_schema.columns
  for tables & columns, pg_indexes for indexes, pg_sequences (or
  information_schema.sequences) for sequences, and pg_proc joined to
  pg_namespace (filter prokind = 'p') and pg_language for stored procedures.
annotations:
  readOnlyHint: true
  destructiveHint: false

---
kind: tool
name: postgres_analytics_list_tables
type: postgres-list-tables
source: postgres-analytics-source
description: >-
  List schema information (columns, constraints, indexes, triggers, owner)
  for all or specified tables in the analytics PostgreSQL database. Optional
  params: table_names (comma-separated), output_format (simple|detailed).
  Prefer this over query_data when you need full, nicely structured table
  schema details.
annotations:
  readOnlyHint: true

# =============================================================================
# TOOLS - MySQL (read-only)
# =============================================================================
# Same two-tool pattern as PostgreSQL above:
#   - mysql_query_data: free-form SELECT, with introspection guidance baked
#     into the description.
#   - mysql_list_tables: richer, pre-formatted schema info than a raw
#     catalog query would give you.
#
# No UPDATE/DELETE/DROP or any other write/DDL capability is exposed here —
# none of the tools below can execute a write statement. That said,
# mysql-execute-sql (used by mysql_query_data) forwards whatever SQL text
# it's given, with no parser to reject a write statement at the Toolbox
# layer — this config alone is not a hard guarantee. For a real guarantee,
# MYSQL_USER in .env must itself be a SELECT-only DB account. This repo
# does not create or modify that account — provisioning it is the database
# owner/DBA's responsibility, outside of MCP setup.

---
kind: tool
name: mysql_query_data
type: mysql-execute-sql
source: mysql-source
description: >-
  Run any read-only SQL query (SELECT) against the MySQL database —
  general data queries as well as ad hoc schema introspection. Do not
  INSERT/UPDATE/DELETE/DROP/TRUNCATE/ALTER — this connection is expected to
  use a SELECT-only DB account, but always write queries as if writes were
  possible and avoid them. For introspection, query information_schema
  directly: information_schema.tables / information_schema.columns for
  tables & columns, information_schema.statistics for indexes, and
  information_schema.routines for stored procedures/functions.
annotations:
  readOnlyHint: true
  destructiveHint: false

---
kind: tool
name: mysql_list_tables
type: mysql-list-tables
source: mysql-source
description: >-
  List schema information (columns, constraints, indexes, triggers, owner)
  for all or specified tables in the MySQL database. Optional params:
  table_names (comma-separated), output_format (simple|detailed). Prefer
  this over query_data when you need full, nicely structured table schema
  details.
annotations:
  readOnlyHint: true

# =============================================================================
# TOOLS - TiDB (read-only)
# =============================================================================
# TiDB is MySQL wire-protocol compatible, but Toolbox models it as its own
# source/tool kind (`tidb`, default port 4000) rather than reusing `mysql`.
# Same two-tool, read-only-by-account pattern as above.
#
# No UPDATE/DELETE/DROP or any other write/DDL capability is exposed here —
# none of the tools below can execute a write statement. That said,
# tidb-execute-sql (used by tidb_query_data) forwards whatever SQL text
# it's given, with no parser to reject a write statement at the Toolbox
# layer — this config alone is not a hard guarantee. For a real guarantee,
# TIDB_USER in .env must itself be a SELECT-only DB account. This repo
# does not create or modify that account — provisioning it is the database
# owner/DBA's responsibility, outside of MCP setup.

---
kind: tool
name: tidb_query_data
type: tidb-execute-sql
source: tidb-source
description: >-
  Run any read-only SQL query (SELECT) against the TiDB database — general
  data queries as well as ad hoc schema introspection. Do not
  INSERT/UPDATE/DELETE/DROP/TRUNCATE/ALTER — this connection is expected to
  use a SELECT-only DB account, but always write queries as if writes were
  possible and avoid them. For introspection, query information_schema
  directly: information_schema.tables / information_schema.columns for
  tables & columns, information_schema.tidb_indexes for indexes, and
  information_schema.routines for stored procedures/functions.
annotations:
  readOnlyHint: true
  destructiveHint: false

---
kind: tool
name: tidb_list_tables
type: tidb-list-tables
source: tidb-source
description: >-
  List schema information (columns, constraints, indexes, triggers, owner)
  for all or specified tables in the TiDB database. Optional params:
  table_names (comma-separated), output_format (simple|detailed). Prefer
  this over query_data when you need full, nicely structured table schema
  details.
annotations:
  readOnlyHint: true

# =============================================================================
# TOOLS - Redis
# =============================================================================

---
kind: tool
name: redis_get
type: redis
source: redis-source
description: Get the string value stored at a given Redis key.
commands:
  - [GET, $key]
parameters:
  - name: key
    type: string
    description: The Redis key to read.

---
kind: tool
name: redis_set
type: redis
source: redis-source
description: Set a string value for a given Redis key.
commands:
  - [SET, $key, $value]
parameters:
  - name: key
    type: string
    description: The Redis key to write.
  - name: value
    type: string
    description: The value to store.

---
kind: tool
name: redis_del
type: redis
source: redis-source
description: Delete a Redis key.
commands:
  - [DEL, $key]
parameters:
  - name: key
    type: string
    description: The Redis key to delete.

---
kind: tool
name: redis_keys
type: redis
source: redis-source
description: >-
  List Redis keys matching a glob-style pattern (e.g. "user:*"). Caution:
  KEYS scans the whole keyspace — use sparingly on large/production instances.
commands:
  - [KEYS, $pattern]
parameters:
  - name: pattern
    type: string
    description: Glob-style pattern to match keys against.

---
kind: tool
name: redis_hgetall
type: redis
source: redis-source
description: Get all fields and values of a Redis hash.
commands:
  - [HGETALL, $key]
parameters:
  - name: key
    type: string
    description: The Redis hash key.

---
kind: tool
name: redis_expire
type: redis
source: redis-source
description: Set a TTL (in seconds) on a Redis key.
commands:
  - [EXPIRE, $key, $seconds]
parameters:
  - name: key
    type: string
    description: The Redis key to set an expiry on.
  - name: seconds
    type: integer
    description: Time to live in seconds.

# =============================================================================
# TOOLS - MongoDB
# =============================================================================
# NOTE: MongoDB tools are bound to one database/collection at config time
# (the Toolbox schema has no dynamic collection param). Duplicate the
# blocks below and change `database`/`collection` for each collection you
# need to expose.

---
kind: tool
name: mongodb_find
type: mongodb-find
source: mongodb-source
description: Find documents in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
limit: 20
filterPayload: |
  { {{if .field}}{{json .field}}: {{json .value}}{{else}}{{end}} }
filterParams:
  - name: field
    type: string
    description: 'Field name to filter on (e.g. "status"). Leave empty to match all documents.'
  - name: value
    type: string
    description: Value to match for the given field.

---
kind: tool
name: mongodb_find_one
type: mongodb-find-one
source: mongodb-source
description: Find a single document in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
filterPayload: |
  { {{json .field}}: {{json .value}} }
filterParams:
  - name: field
    type: string
    description: Field name to filter on.
  - name: value
    type: string
    description: Value to match for the given field.

---
kind: tool
name: mongodb_insert_many
type: mongodb-insert-many
source: mongodb-source
description: >-
  Insert a batch of documents into a MongoDB collection. Call with a `data`
  parameter containing a JSON array of document objects.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}

---
kind: tool
name: mongodb_update_many
type: mongodb-update-many
source: mongodb-source
description: Update all documents in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
filterPayload: |
  { {{json .field}}: {{json .value}} }
filterParams:
  - name: field
    type: string
    description: Field name to filter on.
  - name: value
    type: string
    description: Value to match for the given field.
updatePayload: |
  { "$set": { {{json .set_field}}: {{json .set_value}} } }
updateParams:
  - name: set_field
    type: string
    description: Field name to update.
  - name: set_value
    type: string
    description: New value to set.

---
kind: tool
name: mongodb_delete_many
type: mongodb-delete-many
source: mongodb-source
description: Delete all documents in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
filterPayload: |
  { {{json .field}}: {{json .value}} }
filterParams:
  - name: field
    type: string
    description: Field name to filter on.
  - name: value
    type: string
    description: Value to match for the given field.

---
kind: tool
name: mongodb_aggregate
type: mongodb-aggregate
source: mongodb-source
description: Run an aggregation pipeline against a MongoDB collection.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
readOnly: true
pipelinePayload: |
  {{.pipeline}}
pipelineParams:
  - name: pipeline
    type: string
    description: >-
      A raw JSON array of aggregation pipeline stage documents,
      e.g. [{"$match": {"status": "active"}}, {"$count": "total"}].

# =============================================================================
# TOOLSETS
# =============================================================================

---
kind: toolset
name: postgres-primary-toolset
tools:
  - postgres_primary_query_data
  - postgres_primary_list_tables

---
kind: toolset
name: postgres-analytics-toolset
tools:
  - postgres_analytics_query_data
  - postgres_analytics_list_tables

---
kind: toolset
name: mysql-toolset
tools:
  - mysql_query_data
  - mysql_list_tables

---
kind: toolset
name: tidb-toolset
tools:
  - tidb_query_data
  - tidb_list_tables

---
kind: toolset
name: redis-toolset
tools:
  - redis_get
  - redis_set
  - redis_del
  - redis_keys
  - redis_hgetall
  - redis_expire

---
kind: toolset
name: mongodb-toolset
tools:
  - mongodb_find
  - mongodb_find_one
  - mongodb_insert_many
  - mongodb_update_many
  - mongodb_delete_many
  - mongodb_aggregate

---
kind: toolset
name: all
tools:
  - postgres_primary_query_data
  - postgres_primary_list_tables
  - postgres_analytics_query_data
  - postgres_analytics_list_tables
  - mysql_query_data
  - mysql_list_tables
  - tidb_query_data
  - tidb_list_tables
  - redis_get
  - redis_set
  - redis_del
  - redis_keys
  - redis_hgetall
  - redis_expire
  - mongodb_find
  - mongodb_find_one
  - mongodb_insert_many
  - mongodb_update_many
  - mongodb_delete_many
  - mongodb_aggregate
