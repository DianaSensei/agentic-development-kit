# Connection: PostgreSQL "primary" (read-only).
# Env vars: POSTGRES_PRIMARY_HOST/PORT/DATABASE/USER/PASSWORD - see ../.env.example.
# Self-contained: delete this file to drop the connection, nothing else in this
# directory references it. See ../examples/ to add a different connection.

kind: source
name: postgres-primary-source
type: postgres
host: ${POSTGRES_PRIMARY_HOST}
port: ${POSTGRES_PRIMARY_PORT}
database: ${POSTGRES_PRIMARY_DATABASE}
user: ${POSTGRES_PRIMARY_USER}
password: ${POSTGRES_PRIMARY_PASSWORD}

# Two tools, by design:
#   - query_data: free-form SELECT, with introspection guidance for the
#     agent baked into the description (system catalogs to query).
#   - list_tables: richer, pre-formatted schema info than a raw catalog
#     query would give you.
#
# No UPDATE/DELETE/DROP/DDL tool is defined here. postgres-execute-sql
# forwards whatever SQL text it's given though, with no parser to reject a
# write statement - this config alone is not a hard guarantee. For a real
# guarantee, POSTGRES_PRIMARY_USER in .env must itself be a SELECT-only DB
# role, provisioned by the database owner/DBA.

---
kind: tool
name: postgres_primary_query_data
type: postgres-execute-sql
source: postgres-primary-source
description: >-
  Run any read-only SQL query (SELECT) against the primary PostgreSQL
  database - general data queries as well as ad hoc schema introspection.
  Do not INSERT/UPDATE/DELETE/DROP/TRUNCATE/ALTER - this connection is
  expected to use a SELECT-only DB role, but always write queries as if
  writes were possible and avoid them. For introspection, query the system
  catalogs directly: information_schema.tables / information_schema.columns
  for tables & columns, pg_indexes for indexes, pg_sequences (or
  information_schema.sequences) for sequences, and pg_proc joined to
  pg_namespace (filter prokind = 'p') and pg_language for stored procedures.
annotations:
  readOnlyHint: true
  destructiveHint: false

---
kind: tool
name: postgres_primary_list_tables
type: postgres-list-tables
source: postgres-primary-source
description: >-
  List schema information (columns, constraints, indexes, triggers, owner)
  for all or specified tables in the primary PostgreSQL database. Optional
  params: table_names (comma-separated), output_format (simple|detailed).
  Prefer this over query_data when you need full, nicely structured table
  schema details.
annotations:
  readOnlyHint: true

---
kind: toolset
name: postgres-primary-toolset
tools:
  - postgres_primary_query_data
  - postgres_primary_list_tables
