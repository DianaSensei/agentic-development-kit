# Connection: MongoDB.
# Values (MONGODB_URI/DATABASE/COLLECTION) are configured via this plugin's
# settings (/plugin), which fill in the ${VAR} placeholders below.
# Bound to one database/collection at config time (Toolbox has no dynamic
# collection param). Duplicate the tool blocks below with a different
# `collection:` to expose another collection.
# This is the SHIPPED DEFAULT, seeded once into the writable
# ${CLAUDE_PLUGIN_DATA}/connections/ on first run (see ../../hooks/toolbox-seed.sh)
# - edit/delete the SEEDED COPY there, not this file; changes here only
# affect future fresh installs. Self-contained: nothing else references it.
# See ../examples/ to add a different connection.

kind: source
name: mongodb-source
type: mongodb
uri: ${MONGODB_URI}

---
kind: tool
name: mongodb_find
type: mongodb-find
source: mongodb-source
description: Find documents in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
limit: 20
filterPayload: |
  { {{if .field}}{{json .field}}: {{json .value}}{{else}}{{end}} }
filterParams:
  - name: field
    type: string
    description: 'Field name to filter on (e.g. "status"). Leave empty to match all documents.'
  - name: value
    type: string
    description: Value to match for the given field.

---
kind: tool
name: mongodb_find_one
type: mongodb-find-one
source: mongodb-source
description: Find a single document in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
filterPayload: |
  { {{json .field}}: {{json .value}} }
filterParams:
  - name: field
    type: string
    description: Field name to filter on.
  - name: value
    type: string
    description: Value to match for the given field.

---
kind: tool
name: mongodb_insert_many
type: mongodb-insert-many
source: mongodb-source
description: >-
  Insert a batch of documents into a MongoDB collection. Call with a `data`
  parameter containing a JSON array of document objects.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}

---
kind: tool
name: mongodb_update_many
type: mongodb-update-many
source: mongodb-source
description: Update all documents in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
filterPayload: |
  { {{json .field}}: {{json .value}} }
filterParams:
  - name: field
    type: string
    description: Field name to filter on.
  - name: value
    type: string
    description: Value to match for the given field.
updatePayload: |
  { "$set": { {{json .set_field}}: {{json .set_value}} } }
updateParams:
  - name: set_field
    type: string
    description: Field name to update.
  - name: set_value
    type: string
    description: New value to set.

---
kind: tool
name: mongodb_delete_many
type: mongodb-delete-many
source: mongodb-source
description: Delete all documents in a MongoDB collection matching a filter.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
filterPayload: |
  { {{json .field}}: {{json .value}} }
filterParams:
  - name: field
    type: string
    description: Field name to filter on.
  - name: value
    type: string
    description: Value to match for the given field.

---
kind: tool
name: mongodb_aggregate
type: mongodb-aggregate
source: mongodb-source
description: Run an aggregation pipeline against a MongoDB collection.
database: ${MONGODB_DATABASE}
collection: ${MONGODB_COLLECTION}
readOnly: true
pipelinePayload: |
  {{.pipeline}}
pipelineParams:
  - name: pipeline
    type: string
    description: >-
      A raw JSON array of aggregation pipeline stage documents,
      e.g. [{"$match": {"status": "active"}}, {"$count": "total"}].

---
kind: toolset
name: mongodb-toolset
tools:
  - mongodb_find
  - mongodb_find_one
  - mongodb_insert_many
  - mongodb_update_many
  - mongodb_delete_many
  - mongodb_aggregate
