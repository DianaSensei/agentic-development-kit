# Connection: TiDB (read-only).
# Values (TIDB_HOST/PORT/DATABASE/USER/PASSWORD) are configured via this plugin's
# settings (/plugin), which fill in the ${VAR} placeholders below.
# For TiDB Cloud, Toolbox auto-enables TLS when TIDB_HOST matches the
# *.tidbcloud.com pattern. For a self-hosted cluster that requires TLS, add
# `ssl: true` to the source block below.
# This is the SHIPPED DEFAULT, seeded once into the writable
# ${CLAUDE_PLUGIN_DATA}/connections/ on first run (see ../../hooks/toolbox-seed.sh)
# - edit/delete the SEEDED COPY there, not this file; changes here only
# affect future fresh installs. Self-contained: nothing else references it.
# See ../examples/ to add a different connection.

kind: source
name: tidb-source
type: tidb
host: ${TIDB_HOST}
port: ${TIDB_PORT}
database: ${TIDB_DATABASE}
user: ${TIDB_USER}
password: ${TIDB_PASSWORD}

---
kind: tool
name: tidb_query_data
type: tidb-execute-sql
source: tidb-source
description: >-
  Run any read-only SQL query (SELECT) against the TiDB database - general
  data queries as well as ad hoc schema introspection. Do not
  INSERT/UPDATE/DELETE/DROP/TRUNCATE/ALTER - this connection is expected to
  use a SELECT-only DB account, but always write queries as if writes were
  possible and avoid them. For introspection, query information_schema
  directly: information_schema.tables / information_schema.columns for
  tables & columns, information_schema.tidb_indexes for indexes, and
  information_schema.routines for stored procedures/functions.
annotations:
  readOnlyHint: true
  destructiveHint: false

---
kind: tool
name: tidb_list_tables
type: tidb-list-tables
source: tidb-source
description: >-
  List schema information (columns, constraints, indexes, triggers, owner)
  for all or specified tables in the TiDB database. Optional params:
  table_names (comma-separated), output_format (simple|detailed). Prefer
  this over query_data when you need full, nicely structured table schema
  details.
annotations:
  readOnlyHint: true

---
kind: toolset
name: tidb-toolset
tools:
  - tidb_query_data
  - tidb_list_tables
